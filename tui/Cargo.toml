[package]
name = "nagi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "自分専用の TODO アプリ nagi の TUI"
publish = false

[[bin]]
name = "nagi"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
crossterm = "0.29.0"
ratatui = "0.30.2"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-normalization = "0.1.25"
unicode-width = "0.2.2"
ureq = { version = "3.4.2", features = ["json"] }
uuid = { version = "1.27.0", features = ["v7"] }

[profile.release]
lto = "thin"
strip = true
