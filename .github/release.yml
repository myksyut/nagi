# GitHub が Release の本文に自動で足す PR の一覧の分け方（label で分ける）
changelog:
  exclude:
    labels:
      - dependencies
  categories:
    - title: 互換を壊す変更
      labels:
        - breaking
    - title: 新しい機能
      labels:
        - feature
    - title: 修正
      labels:
        - fix
    - title: その他
      labels:
        - "*"
