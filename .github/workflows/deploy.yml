name: deploy

# main の CI（check-and-test）が通ったら、本番（Cloudflare Workers）に出す。
# pnpm release（build → 本番の D1 にマイグレーション → wrangler deploy）を動かす。
# マイグレーションの前に D1 の Time Travel のブックマークをログに残す（戻すときに使う。無料プランは 7 日）
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 出している途中では止めない（マイグレーションの途中で切らないため）。待っているものは新しいほうだけが残る
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # push で動いた main の CI が通ったときだけ（PR の CI では動かさない）。手で動かしたときは main のときだけ
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://nagi.wizard1026miya.workers.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # pnpm の版は package.json の packageManager に従う
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # 古い main の CI をやり直したときなどに、新しい版を出したあとで古い版で上書きしないよう、
      # 出すのは main の最新のコミットだけにする（D1 は新しいまま Worker だけが古くなるのを防ぐ）
      - name: main の最新か確かめる
        id: latest
        env:
          CANDIDATE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "出す候補：$CANDIDATE／main の最新：$latest"
          if [ -n "$latest" ] && [ "$CANDIDATE" = "$latest" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main の最新ではないので出さない（最新の版は、その版の CI のあとに出る）"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: D1 の Time Travel のブックマークを残す（マイグレーションの前）
        if: steps.latest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 time-travel info nagi
      - name: 本番に出す（pnpm release）
        if: steps.latest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm release
      - name: 本番の応答を確かめる
        if: steps.latest.outputs.deploy == 'true'
        run: |
          base=https://nagi.wizard1026miya.workers.dev
          expect() {
            actual=$(curl -s -o /dev/null -w '%{http_code}' "$base$1")
            echo "$1 → $actual"
            test "$actual" = "$2"
          }
          expect / 200
          expect /api/session 401
          expect /auth/login 302
