name: deploy

# main の CI（check-and-test と tui）が通ったら、Worker を本番（Cloudflare Workers）に出す。
# pnpm release（本番の D1 にマイグレーション → wrangler deploy）を動かす。TUI は tui.yml が Releases に出す。
# マイグレーションの前に D1 の Time Travel のブックマークをログに残す（戻すときに使う。無料プランは 7 日）
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 出している途中では止めない（マイグレーションの途中で切らないため）。待っているものは新しいほうだけが残る
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # push で動いた main の CI が通ったときだけ（PR の CI では動かさない）。手で動かしたときは main のときだけ
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://nagi.wizard1026miya.workers.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # pnpm の版は package.json の packageManager に従う
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # 古い main の CI をやり直したときなどに、新しい版を出したあとで古い版で上書きしないよう、
      # 出すのは main の最新のコミットだけにする（D1 は新しいまま Worker だけが古くなるのを防ぐ）
      - name: main の最新か確かめる
        id: latest
        # pipefail を付ける（git ls-remote の失敗を cut の成功で隠さず、ジョブを失敗させる）
        shell: bash
        env:
          CANDIDATE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "出す候補：$CANDIDATE／main の最新：$latest"
          if [ -n "$latest" ] && [ "$CANDIDATE" = "$latest" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main の最新ではないので出さない（最新の版は、その版の CI のあとに出る）"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: D1 の Time Travel のブックマークを残す（マイグレーションの前）
        if: steps.latest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 time-travel info nagi
      - name: 本番に出す（pnpm release）
        if: steps.latest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm release
      - name: 本番の応答を確かめる
        if: steps.latest.outputs.deploy == 'true'
        run: |
          base=https://nagi.wizard1026miya.workers.dev
          # expect <パス> <期待する状態コード> [curl に足す引数…]
          expect() {
            path=$1 want=$2
            shift 2
            # 出した直後は、まだ前の版が応えることがあるので、少し待ってやり直す
            for _ in 1 2 3 4 5; do
              actual=$(curl -s -o /dev/null -w '%{http_code}' "$@" "$base$path")
              echo "$path → $actual"
              if [ "$actual" = "$want" ]; then return 0; fi
              sleep 3
            done
            return 1
          }
          # ログインなしでは API に入れない
          expect /api/session 401
          # ログインの口（デバイスフロー）がある。本文の形が違うので 400 が返り、GitHub には問い合わせない。
          # Origin を付けない POST（TUI と同じ呼び方）が通ることも、これで確かめられる
          expect /auth/device/token 400 -X POST -H 'Content-Type: application/json' -d '{}'
