name: tui

# TUI（Rust。バイナリの名前は nagi）を、Mac（Apple シリコン）と Linux（x86_64。musl で静的に組むので、glibc の版を問わず動く）でビルドする。
# - PR：tui/ を変えたときに、ビルドして動かせるかだけを確かめる（公開しない）
# - v<版> のタグの push：検査（check）と、各 target のビルドと動作確認（build）を通ったら、GitHub の Releases に出し、Homebrew の tap を更新する
# - 手で動かす（tag を入れる）：そのタグで同じ流れを動かす。Release を新しく作るときは、そのタグの上で動かす（--ref <tag>）。Release がもうあれば作り直さず、どの ref からでも tap の更新だけをやり直せる
# 出すソースは source job でタグを commit SHA に一度だけ解決し、全 job がその SHA を checkout する。Release を作る直前に、タグがまだその SHA を指すか確かめる
# 版の正本は tui/Cargo.toml の version。main への push では出さない。出し方は docs/releasing.md
on:
  pull_request:
    paths:
      - "tui/**"
      - ".github/workflows/tui.yml"
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 出す（または tap だけをやり直す）タグ。例：v0.2.0
        required: true
        type: string

permissions:
  contents: read

env:
  # 出すタグ。タグの push ではその名前、手で動かすときは入力
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # 出すソースを一度だけ決める。タグ名ではなく commit SHA を、以降の job が checkout する（途中でタグが動いても、検査したものと違うものを出さない）。
  # PR では github.sha をそのまま使う
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      REF: ${{ github.ref }}
      EVENT_SHA: ${{ github.sha }}
    steps:
      - name: タグを commit SHA に解決する
        id: resolve
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r type sha < <(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '[.object.type, .object.sha] | join(" ")')
          while [ "$type" = tag ]; do
            read -r type sha < <(gh api "repos/$GH_REPO/git/tags/$sha" --jq '[.object.type, .object.sha] | join(" ")')
          done
          if [ "$type" != commit ]; then
            echo "::error::タグ $TAG が commit を指していない（$type）"
            exit 1
          fi
          # Release を新しく作る実行は、そのタグの上で動かす（provenance がビルドしたソースと一致するように）
          if [ "$REF" = "refs/tags/$TAG" ]; then
            if [ "$EVENT_SHA" != "$sha" ]; then
              echo "::error::この実行の commit $EVENT_SHA と、タグ $TAG の指す $sha が違う"
              exit 1
            fi
          elif ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG はまだない。作るには、タグの上で動かす：gh workflow run tui.yml --ref $TAG -f tag=$TAG（今の ref は $REF）"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "::notice::$TAG は $sha"

  check:
    # 出すときだけ動く。build と並んで動く
    needs: source
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: タグと Cargo.toml の版が同じか確かめる
        working-directory: .
        run: |
          pkgid=$(cargo pkgid --manifest-path tui/Cargo.toml)
          version=${pkgid##*@}
          if [ "v$version" != "$TAG" ]; then
            echo "::error::タグ $TAG と tui/Cargo.toml の版 $version が違う（版の正本は Cargo.toml）"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tui
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    name: build (${{ matrix.target }})
    needs: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    # PR では、新しい push が来たら古いビルドをやめる。出すときのビルドは最後まで動かす
    concurrency:
      group: tui-build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.target }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tui
      # musl の C コンパイラ（SQLite を一緒にビルドするのに要る）
      - name: musl-tools を入れる
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # --locked：Cargo.lock のとおりにビルドする（Cargo.lock が古ければ失敗させる）
      - name: Build nagi
        working-directory: tui
        run: cargo build --release --locked --target ${{ matrix.target }}
      # 作ったバイナリを、その runner で動かす。一時的な HOME なので、手元のデータには触れない
      - name: 動かして確かめる
        env:
          TARGET: ${{ matrix.target }}
        run: |
          pkgid=$(cargo pkgid --manifest-path tui/Cargo.toml)
          version=${pkgid##*@}
          nagi="$PWD/tui/target/$TARGET/release/nagi"
          actual=$("$nagi" --version)
          echo "$actual"
          [ "$actual" = "nagi $version" ] || { echo "::error::nagi --version が 'nagi $version' でない"; exit 1; }
          export HOME
          HOME=$(mktemp -d)
          "$nagi" add smoke
          list=$("$nagi" list --json)
          echo "$list"
          echo "$list" | jq -e 'length == 1 and .[0].title == "smoke"' > /dev/null
      - name: tar.gz にまとめる
        run: tar -czf "nagi-${{ matrix.target }}.tar.gz" -C "tui/target/${{ matrix.target }}/release" nagi
      # Release に出すときだけ、次の job へ渡す
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: nagi-${{ matrix.target }}
          path: nagi-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name != 'pull_request'
    needs: [source, check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: tui-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      # 手で動かしたときに、Release がもうあれば作り直さない（tap の更新のやり直し用）
      - name: Release があるか見る
        id: existing
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG はもうあるので、作り直さない"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # 検査とビルドをしたあとにタグが動いていたら、出さない
      - name: タグがまだ同じ commit を指すか確かめる
        if: steps.existing.outputs.exists != 'true'
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          read -r type sha < <(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '[.object.type, .object.sha] | join(" ")')
          while [ "$type" = tag ]; do
            read -r type sha < <(gh api "repos/$GH_REPO/git/tags/$sha" --jq '[.object.type, .object.sha] | join(" ")')
          done
          if [ "$sha" != "$SOURCE_SHA" ]; then
            echo "::error::タグ $TAG が $SOURCE_SHA から $sha に動いた。出さない（直すなら新しい版を切る）"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        if: steps.existing.outputs.exists != 'true'
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS を作る
        if: steps.existing.outputs.exists != 'true'
        working-directory: dist
        run: |
          sha256sum nagi-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        if: steps.existing.outputs.exists != 'true'
        with:
          subject-path: dist/*
      # 本文は、CHANGELOG のその版の節に、PR の一覧（.github/release.yml の分け方）を足す。節がなければ失敗する。
      # gh は、ファイルを全部載せ終えてから Release を公開する（releases/latest が、ファイルのそろっていない版を指さない）。
      # タグに - があれば（v0.3.0-rc.1 など）プレリリースにして、latest にしない
      - name: Release を作る
        if: steps.existing.outputs.exists != 'true'
        run: |
          version=${TAG#v}
          scripts/changelog-section.sh "$version" < CHANGELOG.md > notes.md
          if [[ "$version" == *-* ]]; then
            channel=(--prerelease)
          else
            channel=(--latest)
          fi
          ls -l dist
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "nagi $version" \
            --notes-file notes.md \
            --generate-notes \
            "${channel[@]}"

  tap:
    # Homebrew の tap（vars.TAP_REPOSITORY。なければ myksyut/homebrew-tap）の formula を、出した版に更新する。
    # 別のリポジトリへ push するので、secrets.TAP_GITHUB_TOKEN（tap の contents を書ける fine-grained PAT）が要る。なければ失敗する。
    # プレリリースでは動かさない
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    needs: [source, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAP_REPOSITORY: ${{ vars.TAP_REPOSITORY || 'myksyut/homebrew-tap' }}
    steps:
      - name: トークンがあるか見る
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "::error::secret TAP_GITHUB_TOKEN がない。入れてから gh workflow run tui.yml --ref $TAG -f tag=$TAG でやり直す"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap
      - name: formula を更新して push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAGI_REPOSITORY: ${{ github.repository }}
        run: |
          version=${TAG#v}
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          scripts/homebrew-formula.sh "$version" SHA256SUMS > tap/Formula/nagi.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/nagi.rb
          if git diff --cached --quiet; then
            echo "変わっていない"
            exit 0
          fi
          git commit -m "nagi $version"
          git push
