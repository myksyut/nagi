name: tui

# TUI（Rust。バイナリの名前は nagi）を、Mac（Apple シリコン）と Linux（x86_64。musl で静的に組むので、glibc の版を問わず動く）でビルドする。
# - PR：tui/ を変えたときに、ビルドできるかだけを確かめる（公開しない）
# - main：tui/ を変えたときに、ビルドして GitHub の Releases に出し、Homebrew の tap を更新する（手でも動かせる）
# 整形・lint・テストは CI（ci.yml の tui）で回す
on:
  pull_request:
    paths:
      - "tui/**"
      - ".github/workflows/tui.yml"
  push:
    branches: [main]
    paths:
      - "tui/**"
      - ".github/workflows/tui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    # PR では、新しい push が来たら古いビルドをやめる。main のビルドは最後まで動かす（Release に出すため）
    # 枠は、PR なら PR の番号ごと、それ以外は ref ごとに分ける（github.ref だけで分けると、マージのあとに始まった
    # PR のビルドが main と同じ枠に入り、main のビルドを止めてしまう。ci.yml と同じ理由）
    concurrency:
      group: tui-build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.target }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tui
      # musl の C コンパイラ（SQLite を一緒にビルドするのに要る）
      - name: musl-tools を入れる
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # --locked：Cargo.lock のとおりにビルドする（Cargo.lock が古ければ失敗させる）
      # NAGI_VERSION：`nagi --version` に出す版。Release の版（release の job の VERSION）と同じにする
      - name: Build nagi
        working-directory: tui
        env:
          NAGI_VERSION: 0.1.${{ github.run_number }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: tar.gz にまとめる
        run: tar -czf "nagi-${{ matrix.target }}.tar.gz" -C "tui/target/${{ matrix.target }}/release" nagi
      # Release に出すときだけ、次の job へ渡す
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: nagi-${{ matrix.target }}
          path: nagi-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: tui-release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha_darwin: ${{ steps.meta.outputs.sha_darwin }}
      sha_linux: ${{ steps.meta.outputs.sha_linux }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: 版と、ファイルの sha256（Homebrew の formula に書く）
        id: meta
        run: |
          echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha_darwin=$(sha256sum dist/nagi-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha_linux=$(sha256sum dist/nagi-x86_64-unknown-linux-musl.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # 版は 0.1.<このワークフローの実行の番号>。出すたびに上がる
      # （ワークフローの名前やファイル名を変えると番号が 1 に戻るので、変えない。Re-run では番号が増えないので、出し直すときは新しく手で動かす）。
      # gh は、ファイルを全部載せ終えてから Release を公開する（releases/latest が、ファイルのそろっていない版を指さない）
      - name: Release を作って latest にする
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: 0.1.${{ github.run_number }}
          NOTES: |
            nagi の TUI（Mac の Apple シリコンと、Linux の x86_64）。
            Homebrew なら `brew install myksyut/tap/nagi`（入れてあれば `brew upgrade nagi`）。
            手で入れるなら、自分の環境の `nagi-<target>.tar.gz` を展開して、中の `nagi` をパスの通った場所に置く。
            Mac でブラウザから落としたときは、`xattr -d com.apple.quarantine nagi` を実行してから開く。
        run: |
          ls -l dist
          gh release create "tui-v$VERSION" \
            dist/nagi-aarch64-apple-darwin.tar.gz \
            dist/nagi-x86_64-unknown-linux-musl.tar.gz \
            --target "$GITHUB_SHA" \
            --title "nagi TUI $VERSION" \
            --notes "$NOTES" \
            --latest

  tap:
    # Homebrew の tap（myksyut/homebrew-tap）の formula を、出した版に更新する。
    # 別のリポジトリへ push するので、secrets.TAP_GITHUB_TOKEN（homebrew-tap の contents を書ける fine-grained PAT）が要る。
    # なければ飛ばす（そのときは、scripts/homebrew-formula.sh で手で更新する）
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN != '' }}
    steps:
      - name: トークンがなければ飛ばす
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::TAP_GITHUB_TOKEN がないので、Homebrew の tap は更新しない（scripts/homebrew-formula.sh で手で更新する）"
      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
        with:
          repository: myksyut/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap
      - name: formula を更新して push
        if: env.HAS_TOKEN == 'true'
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA_DARWIN: ${{ needs.release.outputs.sha_darwin }}
          SHA_LINUX: ${{ needs.release.outputs.sha_linux }}
        run: |
          scripts/homebrew-formula.sh "$VERSION" "$SHA_DARWIN" "$SHA_LINUX" > tap/Formula/nagi.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/nagi.rb
          if git diff --cached --quiet; then
            echo "変わっていない"
            exit 0
          fi
          git commit -m "nagi $VERSION"
          git push
