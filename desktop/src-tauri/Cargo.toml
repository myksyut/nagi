[package]
name = "nagi-desktop"
version = "0.1.0"
description = "nagi のデスクトップ版。本番の URL を開くだけの窓"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-updater = "2.13"
# メモのリンク（新しい窓）を既定のブラウザで開く
tauri-plugin-opener = "2.6"
# tauri::generate_context! が plugins の設定を serde_json で埋め込むため
serde_json = "1"
