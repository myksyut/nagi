<!doctype html>
<html lang="ja" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#141416" />
    <title>nagi</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- crossorigin がないと、CSS からの読み込みと別扱いになって二重に取りに行く -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      外枠の最小限の CSS。JavaScript が届く前から、暗い背景とサイドバーの形で描く。
      色と幅は src/client/styles.css の .dark と :root のトークン
      （--background・--foreground・--sidebar・--sidebar-border・--sidebar-width）と同じ値にそろえる。
    -->
    <style>
      :root {
        color-scheme: dark;
        background: #141416;
        color: #e6e6e9;
      }
      body {
        margin: 0;
      }
      #root:empty::before {
        content: "";
        position: fixed;
        inset: 0 auto 0 0;
        box-sizing: border-box;
        width: 224px;
        background: #0f0f11;
        border-right: 1px solid rgb(255 255 255 / 6%);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
